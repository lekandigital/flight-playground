name: Import exact aircraft assets
on:
  push:
    branches: ["codex/flight-playground-2026-10-04"]
    paths: [".flight-import/**"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reassemble and verify original aircraft blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, gzip, hashlib, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          api = "https://api.github.com/repos/" + repo + "/git/blobs"
          assets = [{"name":"p51d","size":15840084,"sha":"be9b73b526247cdaac9c71cead02cee095116fed","parts":[{"sha":"fa91861e0464e1dba2d06c1c542e911854f68bb0","size":5619079}]},{"name":"p51davinci","size":21382352,"sha":"aec968bbd0e7685822b5ed6d292bed2c1ac79933","parts":[{"sha":"e8f5e1d6a1d3666055ddbdd5dff3d90cd68623dd","size":9000000},{"sha":"311c93a4921930bafd618cce705173b4759f4fb7","size":9000000},{"sha":"d4cadd42cc26ac5b6748aa82da1e81b8b0242031","size":506452}]}]
          def request(url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
              if body is not None:
                  headers["Content-Type"] = "application/json"
              with urllib.request.urlopen(urllib.request.Request(url, data=body, headers=headers), timeout=180) as r:
                  return json.load(r)
          def blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          for asset in assets:
              chunks = []
              for part in asset["parts"]:
                  payload = request(api + "/" + part["sha"])
                  assert payload["encoding"] == "base64"
                  data = base64.b64decode(payload["content"])
                  assert len(data) == part["size"] and blob_sha(data) == part["sha"], "Transport hash mismatch"
                  chunks.append(data)
              data = gzip.decompress(b"".join(chunks))
              assert len(data) == asset["size"] and blob_sha(data) == asset["sha"], "Aircraft hash mismatch"
              result = request(api, {"encoding": "base64", "content": base64.b64encode(data).decode()})
              assert result["sha"] == asset["sha"], "Uploaded hash mismatch"
              print("VERIFIED " + asset["name"] + " " + result["sha"] + " " + str(len(data)), flush=True)
          
          PY
